name: I18n Refactor Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/i18n_runtime_refactor.py
      - tools/i18n_dynamic_refactor.py
      - tools/i18n_dynamic_postfix.py
      - tools/i18n_final_cleanup.py
      - .github/workflows/i18n-refactor.yml

permissions:
  contents: write

concurrency:
  group: i18n-refactor-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor runtime text
        run: |
          python3 tools/i18n_runtime_refactor.py
          python3 tools/i18n_dynamic_refactor.py
          python3 tools/i18n_dynamic_postfix.py
          python3 tools/i18n_final_cleanup.py
          python3 tools/generate_feature_catalog.py
          python3 tools/i18n_audit.py || true

      - name: Read shared build versions
        id: versions
        run: python3 tools/export_build_versions.py >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 \
            "platforms;android-${{ steps.versions.outputs.android_platform }}" \
            "build-tools;${{ steps.versions.outputs.build_tools }}" \
            "platform-tools"

      - name: Compile migrated sources
        run: |
          gradle --no-daemon --stacktrace :ui:assembleDebug
          gradle --no-daemon --stacktrace :suite:assembleCompact

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(i18n): resourceize structured dynamic copy"
          git push origin HEAD:main
