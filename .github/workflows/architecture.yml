name: Validate YSuite Architecture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Verify generated feature catalogs are current
        run: |
          python3 tools/generate_feature_catalog.py --check
          python3 tools/generate_standalone_catalog.py --check

      - name: Verify standalone metadata and resource references
        run: python3 tools/verify_standalone_metadata.py

      - name: Verify mirrored version catalogs are current
        run: python3 tools/sync_version_catalog.py --check

      - name: Smoke test feature scaffold
        run: >-
          python3 tools/new_feature.py
          --id yscaffoldtest
          --name YScaffoldTest
          --package com.yagay.yscaffoldtest
          --description "CI scaffold smoke test"
          --capabilities ROOT,LSPOSED
          --dry-run

      - name: Verify feature catalog architecture
        run: python3 tools/verify_feature_catalog.py

      - name: Verify managed runtime reflection contracts
        run: python3 tools/verify_runtime_contracts.py

      - name: Verify no legacy per-feature app shells
        run: python3 tools/verify_no_legacy_app_shells.py

      - name: Verify Feature/Host boundaries and standalone composer
        run: python3 tools/verify_feature_boundaries.py

      - name: Verify unified feature state gating
        run: python3 tools/verify_feature_state_gating.py

      - name: Verify unified UI framework
        run: python3 tools/verify_ui_framework.py

      - name: Verify YUI single source for current and future features
        run: python3 tools/verify_yui_single_source.py

      - name: Verify YEntryCleaner unified UI
        run: python3 tools/verify_yentry_unified_ui.py

      - name: Verify repository UI screen ownership
        run: python3 tools/verify_ui_screen_ownership.py

      - name: Verify YSuite host ownership
        run: python3 tools/verify_host_ownership.py

      - name: Verify standalone runtime ownership boundaries
        run: python3 tools/verify_runtime_ownership.py

      - name: Scan feature integration hazards
        run: python3 tools/scan_feature_integration.py --root . --fail-on-high-risk
