name: Build affected standalone features

on:
  push:
    branches: [main, rebuild/material3-full-ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify generated catalogs
        run: |
          python3 tools/generate_feature_catalog.py --check
          python3 tools/generate_standalone_catalog.py --check
          python3 tools/sync_version_catalog.py --check

      - name: Plan affected standalone features
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || -z "${BASE_SHA:-}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            python3 tools/plan_standalone_ci.py --all >> "$GITHUB_OUTPUT"
          else
            python3 tools/plan_standalone_ci.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Read shared build versions
        id: versions
        run: python3 tools/export_build_versions.py >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 \
            "platforms;android-${{ steps.versions.outputs.android_platform }}" \
            "build-tools;${{ steps.versions.outputs.build_tools }}" \
            "platform-tools"

      - name: Build ${{ matrix.app }} through generic standalone host
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PciArm64Only=true \
            -PySuiteStandaloneFeature="${APP}" \
            buildFeatureDebug

      - name: Verify ABI and prepare fixed APK name
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          app = os.environ["APP"]
          output = Path("build/standalone")
          expected = output / f"{app}-debug.apk"
          if not expected.is_file():
              apks = sorted(output.glob("*-debug.apk"))
              if len(apks) != 1:
                  raise SystemExit(f"{app}: expected one standalone debug APK, found {apks}")
              apk = apks[0]
          else:
              apk = expected
          abis = set()
          with zipfile.ZipFile(apk) as zf:
              for name in zf.namelist():
                  if name.startswith("lib/") and name.count("/") >= 2:
                      abis.add(name.split("/")[1])
          if abis and abis != {"arm64-v8a"}:
              raise SystemExit(f"{app}: debug APK must be ARM64-only; found {sorted(abis)}")
          target_dir = Path("artifacts")
          target_dir.mkdir(exist_ok=True)
          target = target_dir / f"{app}-debug-arm64-v8a.apk"
          shutil.copy2(apk, target)
          print(f"{app}: {apk} -> {target}; ABIs={sorted(abis) if abis else ['no-native-libs']}")
          PY

      - name: Upload ${{ matrix.app }} debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-arm64-v8a
          path: artifacts/${{ matrix.app }}-debug-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
