name: Build YSuite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source and features
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Scan feature integration hazards
        run: python3 tools/scan_feature_integration.py --root .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          set -o pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          test -s "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"

      - name: Build YSuite Debug APK
        run: gradle --no-daemon --stacktrace :suite:assembleDebug

      - name: Upload YSuite APK
        uses: actions/upload-artifact@v4
        with:
          name: YSuite-debug-${{ github.run_number }}
          path: suite/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
