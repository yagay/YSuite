name: Build YSuite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Verify YSuite host ownership
        run: python3 tools/verify_host_ownership.py

      - name: Scan feature integration hazards
        run: python3 tools/scan_feature_integration.py --root . --fail-on-high-risk

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          test -s "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"

      - name: Verify shared YUI build
        run: gradle --no-daemon --stacktrace :ui:assembleDebug

      - name: Build compact YSuite APK
        run: gradle --no-daemon --stacktrace :suite:assembleCompact

      - name: Verify single YSuite Xposed entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apks = list(Path("suite/YSuite/build/outputs/apk/compact").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one compact APK, found: {apks}")

          expected = ["com.yagay.YSuite.xposed.SuiteXposedModule"]
          with zipfile.ZipFile(apks[0]) as zf:
              path = "META-INF/xposed/java_init.list"
              if path not in zf.namelist():
                  raise SystemExit(f"Missing {path} in {apks[0]}")
              text = zf.read(path).decode("utf-8")

          entries = [
              line.strip() for line in text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if entries != expected:
              raise SystemExit(f"Expected one YSuite Xposed entry, found: {entries}")
          print("Verified single physical Xposed host entry:", entries[0])
          PY

      - name: Verify unified special services
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          candidates = list(Path("suite/YSuite/build/intermediates").rglob("AndroidManifest.xml"))
          manifest = None
          for path in candidates:
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              if "SuiteAccessibilityService" in text and "SuiteNotificationListenerService" in text:
                  manifest = path
                  break

          if manifest is None:
              raise SystemExit("Could not locate merged YSuite manifest")

          root = ET.parse(manifest).getroot()
          package_name = root.get("package") or "com.yagay.YSuite"

          def normalize(name):
              if not name:
                  return name
              if name.startswith("."):
                  return package_name + name
              if "." not in name:
                  return package_name + "." + name
              return name

          services = root.findall(".//service")
          accessibility = [
              normalize(s.get(android + "name")) for s in services
              if s.get(android + "permission") == "android.permission.BIND_ACCESSIBILITY_SERVICE"
          ]
          listeners = [
              normalize(s.get(android + "name")) for s in services
              if s.get(android + "permission") == "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
          ]

          expected_accessibility = ["com.yagay.YSuite.accessibility.SuiteAccessibilityService"]
          expected_listener = ["com.yagay.YSuite.notification.SuiteNotificationListenerService"]
          if accessibility != expected_accessibility:
              raise SystemExit(f"Expected one shared accessibility service, found: {accessibility}")
          if listeners != expected_listener:
              raise SystemExit(f"Expected one shared notification listener, found: {listeners}")

          legacy = {
              "com.yagay.YFloat.LensAccessibilityService",
              "com.yagay.YNotify.collector.UiAccessibilityService",
              "com.yagay.YNotify.collector.NotificationCaptureService",
          }
          names = {normalize(s.get(android + "name")) for s in services}
          leaked = sorted(legacy & names)
          if leaked:
              raise SystemExit(f"Standalone special services leaked into YSuite: {leaked}")

          print(f"Verified shared services in {manifest}")
          print("Accessibility:", accessibility)
          print("Notification listener:", listeners)
          PY

      - name: Report compact APK size and ABI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import zipfile

          apks = list(Path("suite/YSuite/build/outputs/apk/compact").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one compact APK, found: {apks}")

          apk = apks[0]
          size_mb = apk.stat().st_size / (1024 * 1024)
          by_abi = defaultdict(int)
          native_total = 0
          with zipfile.ZipFile(apk) as zf:
              for info in zf.infolist():
                  if not info.filename.startswith("lib/") or info.is_dir():
                      continue
                  parts = info.filename.split("/")
                  if len(parts) < 3:
                      continue
                  by_abi[parts[1]] += info.file_size
                  native_total += info.file_size

          abis = sorted(by_abi)
          if abis != ["arm64-v8a"]:
              raise SystemExit(f"Compact APK must be ARM64-only; found ABIs: {abis}")

          print(f"Compact APK: {apk}")
          print(f"APK size: {size_mb:.2f} MiB")
          print(f"Native libraries: {native_total / (1024 * 1024):.2f} MiB")
          for abi, size in sorted(by_abi.items()):
              print(f"  {abi}: {size / (1024 * 1024):.2f} MiB")

          if size_mb > 170:
              raise SystemExit(f"Compact APK exceeded 170 MiB size budget: {size_mb:.2f} MiB")
          PY

      - name: Prepare fixed APK name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find suite/YSuite/build/outputs/apk/compact -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/YSuite-compact-arm64-v8a.apk

      - name: Upload compact YSuite APK
        uses: actions/upload-artifact@v4
        with:
          name: YSuite-compact-arm64-v8a
          path: artifacts/YSuite-compact-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
