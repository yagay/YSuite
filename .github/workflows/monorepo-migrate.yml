name: Migrate YSuite to monorepo

on:
  push:
    branches: [monorepo-migration]
    paths:
      - '.github/workflows/monorepo-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: monorepo-migration
          fetch-depth: 0
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          test -s "${ANDROID_HOME}/platforms/android-37.0/android.jar"

      - name: Import standalone repositories
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .monorepo-migrated ]]; then
            echo "Monorepo migration already applied."
            exit 0
          fi

          rm -rf apps
          mkdir -p apps libs

          repos=(
            YDiag
            YNotify
            YPower
            YMiniGuard
            YEntryCleaner
            YNFC
            YTaskManager
            YParam
            YFloat
          )

          for repo in "${repos[@]}"; do
            echo "Importing ${repo}..."
            tmp="/tmp/ysuite-${repo}"
            rm -rf "$tmp"
            git clone --depth 1 --branch main "https://github.com/yagay/${repo}.git" "$tmp"
            rm -rf "$tmp/.git"
            # Root CI is authoritative in the monorepo. Keep other project metadata,
            # but do not retain nested workflows that GitHub would never execute.
            rm -rf "$tmp/.github/workflows"
            mkdir -p "apps/${repo}"
            cp -a "$tmp/." "apps/${repo}/"
          done

          # Remove old submodule gitlinks only after all source trees have been copied.
          for path in \
            features/YDiag \
            features/YNotify \
            features/YPower \
            features/YMiniGuard \
            features/YEntryCleaner \
            features/YNFC \
            features/YTaskManager \
            features/YParam \
            features/YFloat; do
            git rm -f "$path"
          done
          git rm -f .gitmodules
          rmdir features 2>/dev/null || true
          rm -rf .git/modules/features 2>/dev/null || true

          # Shared code and the aggregate APK host get stable monorepo locations.
          git mv core libs/ycore
          git mv ui libs/yui
          git mv suite .ysuite-host-tmp
          mkdir -p suite
          git mv .ysuite-host-tmp suite/YSuite

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }

          rootProject.name = "YSuite"

          include(":ui")
          project(":ui").projectDir = file("libs/yui")

          include(":core")
          project(":core").projectDir = file("libs/ycore")

          include(":suite")
          project(":suite").projectDir = file("suite/YSuite")

          include(":ydiag-feature")
          project(":ydiag-feature").projectDir = file("apps/YDiag/feature")

          include(":ynotify-feature")
          project(":ynotify-feature").projectDir = file("apps/YNotify/feature")

          include(":ypower-feature")
          project(":ypower-feature").projectDir = file("apps/YPower/feature")

          include(":yminiguard-feature")
          project(":yminiguard-feature").projectDir = file("apps/YMiniGuard/feature")

          include(":yentrycleaner-feature")
          project(":yentrycleaner-feature").projectDir = file("apps/YEntryCleaner/feature")

          include(":ynfc-feature")
          project(":ynfc-feature").projectDir = file("apps/YNFC/feature")

          include(":ytask-feature")
          project(":ytask-feature").projectDir = file("apps/YTaskManager/feature")

          include(":yparam-feature")
          project(":yparam-feature").projectDir = file("apps/YParam/feature")

          include(":yfloat-feature")
          project(":yfloat-feature").projectDir = file("apps/YFloat/feature")

          include(":yfloat-ppocr-sdk")
          project(":yfloat-ppocr-sdk").projectDir = file("apps/YFloat/ppocr-sdk")
          EOF

          touch .monorepo-migrated

      - name: Build migrated YSuite host
        shell: bash
        run: gradle --no-daemon --stacktrace :suite:assembleCompact

      - name: Verify migrated layout
        shell: bash
        run: |
          set -euo pipefail
          test -f .monorepo-migrated
          test -d apps/YDiag/feature
          test -d apps/YNotify/feature
          test -d apps/YPower/feature
          test -d apps/YMiniGuard/feature
          test -d apps/YEntryCleaner/feature
          test -d apps/YNFC/feature
          test -d apps/YTaskManager/feature
          test -d apps/YParam/feature
          test -d apps/YFloat/feature
          test -d libs/ycore
          test -d libs/yui
          test -d suite/YSuite
          test ! -e .gitmodules
          test ! -d features

      - name: Commit migrated source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(monorepo): import app repositories"
          git push origin HEAD:monorepo-migration
