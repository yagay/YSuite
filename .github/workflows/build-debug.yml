name: Build YSuite Debug

on:
  push:
    branches: [main, rebuild/material3-full-ui, refactor/yfloat-google-v2, refactor/yfloat-circle-native, refactor/yfloat-cts-session, experiment/yfloat-google-lens-image-bridge, experiment/yfloat-paddle-mobile]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          # Compare full push ranges, including multi-commit pushes.
          fetch-depth: 0

      - name: Verify generated feature catalog is current
        run: python3 tools/generate_feature_catalog.py --check

      - name: Verify mirrored version catalogs are current
        run: python3 tools/sync_version_catalog.py --check

      - name: Verify YSuite host ownership
        run: python3 tools/verify_host_ownership.py

      - name: Verify embedded host IPC and health recovery contracts
        run: python3 tools/verify_host_runtime_contracts.py

      - name: Scan feature integration hazards
        run: python3 tools/scan_feature_integration.py --root . --fail-on-high-risk

      - name: Verify shared feature infrastructure
        run: python3 tools/verify_shared_infrastructure.py

      - name: Verify local Paddle OCR model and document contracts
        run: python3 tools/verify_paddle_independent_models.py

      - name: Verify live YUI visual contracts
        run: python3 tools/verify_yui_visual_contracts.py

      - name: Verify UI overflow and extreme appearance settings
        run: python3 tools/verify_yui_overflow_contracts.py

      - name: Verify YUI settings actually control component appearance
        run: python3 tools/verify_yui_setting_coverage.py

      - name: Reject local button size and line-count overrides in all modules
        run: python3 tools/verify_yui_intrinsic_actions.py

      - name: Verify normal screens and all shared controls are YUI owned
        run: |
          python3 tools/verify_ui_screen_ownership.py
          python3 tools/verify_yui_controls.py

      - name: Verify no independently owned YUI interaction surfaces remain
        run: python3 tools/verify_yui_independent_surfaces.py

      - name: Inventory remaining visual constants for review
        run: python3 tools/audit_yui_repository.py

      - name: Read shared build versions
        id: versions
        run: python3 tools/export_build_versions.py >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}

      # setup-gradle restores dependencies; this separate cache stores Gradle
      # output snapshots for unchanged feature/library compilation tasks.
      # Keys are immutable per commit, with prior successful commits as fallback.
      - name: Restore reusable module compilation results
        id: module-cache
        uses: actions/cache@v4
        with:
          path: .gradle/ci-build-cache
          key: ysuite-arm64-gradle-tasks-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ysuite-arm64-gradle-tasks-v1-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 \
            "platforms;android-${{ steps.versions.outputs.android_platform }}" \
            "build-tools;${{ steps.versions.outputs.build_tools }}" \
            "platform-tools"
          test -s "${ANDROID_HOME}/platforms/android-${{ steps.versions.outputs.android_platform }}/android.jar"
          test -x "${ANDROID_HOME}/build-tools/${{ steps.versions.outputs.build_tools }}/aapt2"
          # YPower's externalNativeBuild pins NDK/CMake versions. Never let
          # Gradle auto-install native tools from a partially downloaded ZIP.
          # Retry transient Google SDK archive failures and verify each install.
          for component in "ndk;27.2.12479018" "cmake;3.22.1"; do
            case "$component" in
              ndk*) installed="${ANDROID_HOME}/ndk/27.2.12479018/source.properties" ;;
              *)    installed="${ANDROID_HOME}/cmake/3.22.1/source.properties" ;;
            esac
            if test -s "$installed"; then continue; fi
            for attempt in 1 2 3 4; do
              echo "::group::Install $component attempt $attempt"
              if "$SDKMANAGER" --channel=3 "$component" && test -s "$installed"; then
                echo "::endgroup::"
                break
              fi
              echo "::warning::Android SDK archive installation failed: $component attempt $attempt"
              echo "::endgroup::"
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Required Android native tool remains unavailable: $component"
                exit 1
              fi
              sleep $((attempt * 8))
            done
          done

      - name: Verify shared platform data sources
        run: python3 tools/verify_shared_app_catalog.py

      - name: Verify TaskManager unified UI and callbacks
        run: python3 tools/verify_taskmanager_ui.py

      - name: Verify lazy list and Root sampling performance contracts
        run: python3 tools/verify_list_performance_contracts.py

      - name: Verify row alignment on the actual shared YUI renderer
        run: python3 tools/verify_yui_row_alignment.py

      - name: Select tests affected by changed source modules
        id: affected
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_plan_ysuite_debug.py'
          # The planner appends test_tasks to GITHUB_OUTPUT itself; keep logs on stdout.
          python3 tools/plan_ysuite_debug.py --base "${BASE_SHA:-}" --head "${HEAD_SHA:-}"

      - name: Incrementally compile features and merge ARM64 YSuite APK
        shell: bash
        env:
          CHANGED_MODULE_TESTS: ${{ steps.affected.outputs.test_tasks }}
        run: |
          set -euo pipefail
          # Test only directly affected features (or all on shared API/build
          # changes). Gradle follows the actual project dependency graph and
          # loads cacheable unchanged task outputs from the restored cache.
          read -r -a tests <<< "${CHANGED_MODULE_TESTS:-}"
          # A new refactor branch has no comparable previous module diff in
          # the planner. Always run real YFloat reducer/ownership JUnit tests
          # for this branch, rather than treating "none" as validation.
          if [[ "${GITHUB_REF_NAME}" == "refactor/yfloat-cts-session" ]]; then
            tests+=( :yfloat-feature:testDebugUnitTest )
          fi
          # Source-offset OCR text mapping and CTC whitespace need actual JUnit
          # verification, not just static source markers.
          if [[ "${GITHUB_REF_NAME}" == "experiment/yfloat-paddle-mobile" ]]; then
            tests+=( :yfloat-feature:testDebugUnitTest :yfloat-ppocr-sdk:testDebugUnitTest )
          fi
          echo "Selected module tests: ${tests[*]:-(none)}"
          gradle --no-daemon --build-cache --parallel --max-workers=2 --stacktrace \
            "${tests[@]}" :suite:assembleDebug
          echo "Build cache usage (up-to-date / from-cache tasks) is reported in Gradle logs."

      - name: Verify debug APK ABI and Xposed entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apks = list(Path("suite/YSuite/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one debug APK, found: {apks}")

          apk = apks[0]
          abis = set()
          with zipfile.ZipFile(apk) as zf:
              for info in zf.infolist():
                  if info.filename.startswith("lib/") and not info.is_dir():
                      parts = info.filename.split("/")
                      if len(parts) >= 3:
                          abis.add(parts[1])

              path = "META-INF/xposed/java_init.list"
              if path not in zf.namelist():
                  raise SystemExit(f"Missing {path} in {apk}")
              entries = [
                  line.strip()
                  for line in zf.read(path).decode("utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

          if sorted(abis) != ["arm64-v8a"]:
              raise SystemExit(f"Debug APK must be ARM64-only; found ABIs: {sorted(abis)}")

          expected = ["com.yagay.YSuite.xposed.SuiteXposedModule"]
          if entries != expected:
              raise SystemExit(f"Expected one YSuite Xposed entry, found: {entries}")

          print("Debug APK:", apk)
          print("ABI: arm64-v8a")
          print("Xposed entry:", entries[0])
          PY

      - name: Prepare fixed debug APK name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find suite/YSuite/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/YSuite-debug-arm64-v8a.apk

      - name: Upload YSuite debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YSuite-debug-arm64-v8a
          path: artifacts/YSuite-debug-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
