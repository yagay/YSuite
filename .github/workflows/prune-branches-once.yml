name: Prune old YSuite branches once

on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/prune-branches-once.yml

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/test' && github.repository == 'yagay/YSuite'
    runs-on: ubuntu-latest
    steps:
      - name: Keep main and test and delete other remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          all="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          grep -Fxq main <<< "$all"
          grep -Fxq test <<< "$all"

          failed=0
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              main|test) echo "Preserving $branch"; continue ;;
            esac
            echo "Deleting $branch"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null; then
              echo "::error::Could not delete $branch"
              failed=1
            fi
          done <<< "$all"

          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)"
          echo "Remaining branches:"
          printf '%s\n' "$remaining"
          [[ "$remaining" == "$(printf 'main\ntest')" ]] || failed=1
          exit "$failed"
