name: Verify clean architecture

on:
  push:
    branches:
      - rebuild/standard-architecture
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify architecture boundaries
        run: python tools/verify_architecture.py
      - name: Verify localization parity
        run: python tools/verify_localization.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build all clean modules
        run: gradle build --stacktrace
