name: Verify clean architecture

on:
  push:
    branches:
      - rebuild/product-ui-system
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify architecture boundaries
        run: python tools/verify_architecture.py
      - name: Verify localization parity
        run: python tools/verify_localization.py
      - name: Verify frozen foundation
        run: python tools/verify_foundation_contract.py
      - name: Audit feature migrations
        run: python tools/verify_feature_migration.py
      - name: Verify feature tooling
        run: |
          python -m py_compile             tools/new_feature.py             tools/remove_feature.py             tools/verify_standalone_config.py \
            tools/verify_foundation_contract.py \
            tools/verify_feature_migration.py
          python tools/new_feature.py ci_probe --product Tool --dry-run
          python tools/verify_standalone_config.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Run Debug unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Build YFiles standalone smoke
        run: gradle :host:standalone:assembleDebug -PstandaloneFeature=yfiles --stacktrace
      - name: Build YSuite Debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload YSuite Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YSuite-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
