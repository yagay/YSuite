name: Finalize YSuite monorepo

on:
  push:
    branches: [monorepo-migration]
    paths:
      - '.github/workflows/monorepo-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout monorepo migration
        uses: actions/checkout@v4
        with:
          ref: monorepo-migration
          fetch-depth: 0

      - name: Update repository paths and documentation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/verify_host_ownership.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('ROOT / "suite/', 'ROOT / "suite/YSuite/')
          text = text.replace('ROOT / "core/', 'ROOT / "libs/ycore/')
          text = text.replace('ROOT / "ui/', 'ROOT / "libs/yui/')
          text = text.replace('ROOT / "features/YFloat/', 'ROOT / "apps/YFloat/')
          text = text.replace('suite/build.gradle.kts', 'suite/YSuite/build.gradle.kts')
          p.write_text(text, encoding='utf-8')

          p = Path('tools/scan_feature_integration.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('features = root / "features"', 'features = root / "apps"')
          text = text.replace('no feature submodules found', 'no app feature modules found')
          text = text.replace('after submodules are checked out', 'after the monorepo is checked out')
          p.write_text(text, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # YSuite

          YSuite is the monorepo for the Android/LSPosed projects that share the YSuite host, UI and runtime infrastructure.

          ## Repository layout

          ```text
          YSuite/
          ├── apps/
          │   ├── YDiag/
          │   ├── YNotify/
          │   ├── YPower/
          │   ├── YMiniGuard/
          │   ├── YEntryCleaner/
          │   ├── YNFC/
          │   ├── YTaskManager/
          │   ├── YParam/
          │   └── YFloat/
          ├── libs/
          │   ├── ycore/
          │   └── yui/
          ├── suite/
          │   └── YSuite/
          ├── docs/
          ├── tools/
          └── .github/workflows/
          ```

          ## Architecture

          Each project under `apps/` keeps its standalone `app/` shell and reusable `feature/` module. The unified YSuite APK consumes those same feature modules directly, so feature code is not copied into the host.

          `libs/yui` is the shared UI implementation. `libs/ycore` owns small host-level contracts and shared runtime infrastructure. Code should move into `libs/` only when multiple projects genuinely share it; app-specific behavior stays inside its app folder.

          The unified APK host is `suite/YSuite` with application id `com.yagay.YSuite`. YSuite remains the physical owner for shared system-facing capabilities such as the combined Xposed entry and host-level services.

          ## Included projects

          - YDiag
          - YNotify
          - YPower
          - YMiniGuard
          - YEntryCleaner
          - YNFC
          - YTaskManager
          - YParam
          - YFloat

          ## Build

          Build the unified compact ARM64 APK from the repository root:

          ```bash
          gradle :suite:assembleCompact
          ```

          The resulting APK is under `suite/YSuite/build/outputs/apk/compact/`.

          The original standalone repositories are left intact as migration safety copies. New shared development should use this monorepo as the source of truth.

          ## Project rules

          Before changing shared or integrated behavior, check:

          - `docs/PRODUCT_REQUIREMENTS.md`
          - `docs/MODULE_REQUIREMENTS.md`
          - `docs/ARCHITECTURE.md`
          - `docs/MONOREPO_MIGRATION.md`

          A successful compile does not override those product and maintenance requirements.
          EOF

          cat > .github/workflows/build.yml <<'EOF'
          name: Build YSuite

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-24.04
              timeout-minutes: 40
              steps:
                - name: Checkout monorepo
                  uses: actions/checkout@v4

                - name: Verify YSuite host ownership
                  run: python3 tools/verify_host_ownership.py

                - name: Scan feature integration hazards
                  run: python3 tools/scan_feature_integration.py --root . --fail-on-high-risk

                - name: Set up Java 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '9.4.1'

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3
                  with:
                    packages: platform-tools
                    log-accepted-android-sdk-licenses: false

                - name: Install Android SDK
                  shell: bash
                  run: |
                    set -euo pipefail
                    sdkmanager "cmdline-tools;23.0"
                    SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
                    "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
                    test -s "${ANDROID_HOME}/platforms/android-37.0/android.jar"

                - name: Build compact YSuite APK
                  run: gradle --no-daemon --stacktrace :suite:assembleCompact

                - name: Verify compact APK
                  shell: bash
                  run: |
                    python3 - <<'PY'
                    from pathlib import Path
                    from collections import defaultdict
                    import zipfile

                    apks = list(Path('suite/YSuite/build/outputs/apk/compact').glob('*.apk'))
                    if len(apks) != 1:
                        raise SystemExit(f'Expected exactly one compact APK, found: {apks}')

                    apk = apks[0]
                    by_abi = defaultdict(int)
                    with zipfile.ZipFile(apk) as zf:
                        init_path = 'META-INF/xposed/java_init.list'
                        if init_path not in zf.namelist():
                            raise SystemExit(f'Missing {init_path}')
                        entries = [
                            line.strip() for line in zf.read(init_path).decode('utf-8').splitlines()
                            if line.strip() and not line.lstrip().startswith('#')
                        ]
                        expected = ['com.yagay.YSuite.xposed.SuiteXposedModule']
                        if entries != expected:
                            raise SystemExit(f'Expected one YSuite Xposed entry, found: {entries}')

                        for info in zf.infolist():
                            if not info.filename.startswith('lib/') or info.is_dir():
                                continue
                            parts = info.filename.split('/')
                            if len(parts) >= 3:
                                by_abi[parts[1]] += info.file_size

                    abis = sorted(by_abi)
                    if abis != ['arm64-v8a']:
                        raise SystemExit(f'Compact APK must be ARM64-only; found ABIs: {abis}')

                    size_mb = apk.stat().st_size / (1024 * 1024)
                    print(f'Compact APK: {apk}')
                    print(f'APK size: {size_mb:.2f} MiB')
                    if size_mb > 170:
                        raise SystemExit(f'Compact APK exceeded 170 MiB size budget: {size_mb:.2f} MiB')
                    PY

                - name: Prepare fixed APK name
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p artifacts
                    APK="$(find suite/YSuite/build/outputs/apk/compact -maxdepth 1 -type f -name '*.apk' | head -n 1)"
                    test -n "$APK"
                    cp "$APK" artifacts/YSuite-compact-arm64-v8a.apk

                - name: Upload compact YSuite APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: YSuite-compact-arm64-v8a
                    path: artifacts/YSuite-compact-arm64-v8a.apk
                    if-no-files-found: error
                    retention-days: 14
          EOF

          rm -f .github/workflows/monorepo-migrate.yml
          rm -f .github/workflows/monorepo-finalize.yml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Validate monorepo scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_host_ownership.py
          python3 tools/scan_feature_integration.py --root . --fail-on-high-risk

      - name: Build final monorepo host
        run: gradle --no-daemon --stacktrace :suite:assembleCompact

      - name: Commit final monorepo configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(monorepo): finalize paths and CI"
          git push origin HEAD:monorepo-migration
