import java.security.MessageDigest

plugins {
    id 'com.android.library'
}

def yFloatHashFiles = { Collection<File> sourceFiles ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    sourceFiles.findAll { it != null && it.exists() }
            .sort { a, b -> a.path <=> b.path }
            .each { File source ->
                digest.update(project.relativePath(source).replace('\\', '/').getBytes('UTF-8'))
                digest.update((byte) 0)
                digest.update(source.bytes)
                digest.update((byte) 0)
            }
    return digest.digest().encodeHex().toString()
}

def hookRoot = file('src/main/java/com/yagay/YFloat/hook')
def xposedRoot = file('../app/src/main/resources/META-INF/xposed')
def hookCommonFiles = [
        file('src/main/java/com/yagay/YFloat/hook/YFloatModule.java'),
        file('src/main/java/com/yagay/YFloat/hook/LsposedRuntimeProvider.java'),
        file('src/main/java/com/yagay/YFloat/LsposedRuntimeConfig.java'),
        new File(xposedRoot, 'java_init.list'),
        new File(xposedRoot, 'module.prop'),
        new File(xposedRoot, 'scope.list')
]
def googleHookFiles = new ArrayList<File>(hookCommonFiles)
googleHookFiles.addAll(fileTree(hookRoot) { include 'Google*.java' }.files)
googleHookFiles.add(file('src/main/java/com/yagay/YFloat/GoogleCtsContract.java'))
googleHookFiles.add(file('src/main/java/com/yagay/YFloat/CanonicalFramePolicy.java'))
def systemUiHookFiles = new ArrayList<File>(hookCommonFiles)
def systemServerHookFiles = new ArrayList<File>(hookCommonFiles)
systemServerHookFiles.add(file('src/main/java/com/yagay/YFloat/hook/SecureScreenshotHook.java'))
def ppocrProjectPath = providers.gradleProperty('yfloatPpocrProjectPath').getOrElse(':ppocr-sdk')
def runtimeVersionCode = providers.gradleProperty('ySuiteHostVersionCode').getOrElse('191')
def sharedSuiteBranch = providers.gradleProperty('ySuiteSharedBranch').getOrElse('main')
def sharedJavaVersion = JavaVersion.toVersion(libs.versions.java.get())

android {
    namespace 'com.yagay.YFloat'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        buildConfigField 'int', 'VERSION_CODE', runtimeVersionCode
        buildConfigField 'String', 'VERSION_NAME', '"3.1.39"'
        buildConfigField 'String', 'GOOGLE_HOOK_FINGERPRINT', '"' + yFloatHashFiles(googleHookFiles) + '"'
        buildConfigField 'String', 'SYSTEMUI_HOOK_FINGERPRINT', '"' + yFloatHashFiles(systemUiHookFiles) + '"'
        buildConfigField 'String', 'SYSTEM_SERVER_HOOK_FINGERPRINT', '"' + yFloatHashFiles(systemServerHookFiles) + '"'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility sharedJavaVersion
        targetCompatibility sharedJavaVersion
    }
}

dependencies {
    if (rootProject.findProject(':api') != null) {
        implementation project(':api')
    } else if (rootProject.findProject(':ysuite-api') != null) {
        implementation project(':ysuite-api')
    } else {
        implementation('com.github.yagay.YSuite:api') {
            version { branch = sharedSuiteBranch }
        }
    }
    if (rootProject.findProject(':ui') != null) {
        implementation project(':ui')
    } else if (rootProject.findProject(':ysuite-ui') != null) {
        implementation project(':ysuite-ui')
    } else {
        implementation('com.github.yagay.YSuite:ui') {
            version { branch = sharedSuiteBranch }
        }
    }
    compileOnly(libs.libxposed.api)
    implementation(libs.libxposed.service)
    implementation(libs.hiddenapibypass)
    implementation(libs.mlkit.text.recognition)
    implementation(libs.mlkit.text.recognition.chinese)
    implementation project(ppocrProjectPath)
    implementation(libs.kotlinx.coroutines.android)
    testImplementation(libs.junit)
}
