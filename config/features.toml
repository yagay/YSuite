capabilities = ["ROOT", "LSPOSED"]
lifecycle = "legacy"
hooks = [{ id = "ytaskmanager/main", class = "com.yagay.YTaskManager.xposed.TaskManagerModule" }]

[[feature]]
id = "yparam"
name = "YParam"
description = "应用 DPI、语言、定位与参数覆盖"
gradle_module = ":yparam-feature"
project_dir = "apps/YParam/feature"
entry_activity = "com.yagay.yparam.ui.MainActivity"
runtime = "com.yagay.yparam.YParamSuiteRuntime"
