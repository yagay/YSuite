schema = 3

[[feature]]
id = "yentrycleaner"
name = "YEntryCleaner"
description = "Share, open-with, and component entry cleanup"
gradle_module = ":yentrycleaner-feature"
project_dir = "apps/YEntryCleaner/feature"
entry_activity = "com.yagay.YEntryCleaner.ui.MainActivity"
runtime = "com.yagay.YEntryCleaner.YEntryCleanerRuntime"
capabilities = ["ROOT", "LSPOSED"]
lifecycle = "managed"
hooks = [
  { id = "yentrycleaner/main", class = "com.yagay.YEntryCleaner.xposed.YEntryCleanerModule" },
  { id = "yentrycleaner/state", class = "com.yagay.YEntryCleaner.xposed.ComponentStateGuardModule" },
  { id = "yentrycleaner/discovery", class = "com.yagay.YEntryCleaner.xposed.ComponentDiscoveryFilterModule" },
  { id = "yentrycleaner/probe", class = "com.yagay.YEntryCleaner.xposed.SuiteRuntimeProbeBridgeModule" },
]

[[feature]]
id = "ydiag"
name = "YDiag"
description = "App logs and fault diagnostics"
gradle_module = ":ydiag-feature"
project_dir = "apps/YDiag/feature"
entry_activity = "com.yagay.ydiag.ui.MainActivity"
runtime = "com.yagay.ydiag.YDiagRuntime"
capabilities = ["ROOT", "LSPOSED"]
lifecycle = "managed"
hooks = [{ id = "ydiag/main", class = "com.yagay.ydiag.xposed.YDiagModule" }]

[[feature]]
id = "ynotify"
name = "YNotify"
description = "Notification, Toast, and heads-up history"
gradle_module = ":ynotify-feature"
project_dir = "apps/YNotify/feature"
entry_activity = "com.yagay.YNotify.ui.MainActivity"
runtime = "com.yagay.YNotify.YNotifyRuntime"
capabilities = ["LSPOSED", "ACCESSIBILITY", "NOTIFICATION_LISTENER"]
lifecycle = "managed"
accessibility_bridge = "com.yagay.YNotify.collector.UiAccessibilityBridge"
notification_listener_bridge = "com.yagay.YNotify.collector.NotificationListenerBridge"
ipc_routes = [
  { action = "com.yagay.YNotify.XPOSED_EVENT", receiver = "com.yagay.YNotify.collector.XposedEventReceiver" },
]
replaced_components = [
  { type = "service", class = "com.yagay.YNotify.collector.NotificationCaptureService" },
  { type = "service", class = "com.yagay.YNotify.collector.UiAccessibilityService" },
  { type = "receiver", class = "com.yagay.YNotify.collector.XposedEventReceiver" },
]
hooks = [{ id = "ynotify/main", class = "com.yagay.YNotify.xposed.YNotifyModule" }]

[[feature]]
id = "ypower"
name = "YPower"
description = "App enhancements, detection, and runtime diagnostics"
gradle_module = ":ypower-feature"
project_dir = "apps/YPower/feature"
entry_activity = "com.yagay.ypower.ui.MainActivity"
runtime = "com.yagay.ypower.YPowerRuntime"
capabilities = ["ROOT", "LSPOSED"]
lifecycle = "managed"
boot_receiver = "com.yagay.ypower.root.BootReceiver"
replaced_components = [
  { type = "receiver", class = "com.yagay.ypower.root.BootReceiver" },
  { type = "service", class = "com.yagay.ypower.root.YPowerRootService" },
]
hooks = [
  { id = "ypower/main", class = "com.yagay.ypower.hook.YPowerModule" },
  { id = "ypower/security", class = "com.yagay.ypower.hook.SupplementalSecurityModule" },
  { id = "ypower/observation", class = "com.yagay.ypower.hook.DeepObservationModule" },
]

[[feature]]
id = "yminiguard"
name = "YMiniGuard"
description = "Mini-window keep-alive and background playback guard"
gradle_module = ":yminiguard-feature"
project_dir = "apps/YMiniGuard/feature"
entry_activity = "com.yagay.YMiniGuard.MainActivity"
runtime = "com.yagay.YMiniGuard.GuardRuntime"
capabilities = ["ROOT", "LSPOSED", "NOTIFICATIONS"]
lifecycle = "managed"
replaced_components = [
  { type = "provider", class = "com.yagay.YMiniGuard.EngineStatusProvider" },
]
hooks = [{ id = "yminiguard/main", class = "com.yagay.YMiniGuard.GuardModule" }]

[[feature]]
id = "ynfc"
