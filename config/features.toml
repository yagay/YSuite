[[feature]]
id = "yfloat"
name = "YFloat"
description = "Floating actions, text selection, and shortcuts"
gradle_module = ":yfloat-feature"
project_dir = "apps/YFloat/feature"
entry_activity = "com.yagay.YFloat.MainActivity"
runtime = "com.yagay.YFloat.YFloatSuiteRuntime"
standalone_package = "com.yagay.YFloat"
standalone_enabled = true
standalone_label = "@string/yfloat_app_name"
standalone_description_resource = "@string/app_description"
standalone_theme = "@style/Theme.YFloat"
standalone_uses_cleartext_traffic = false
capabilities = ["ROOT", "LSPOSED", "ACCESSIBILITY", "OVERLAY", "NOTIFICATIONS"]
lifecycle = "managed"
boot_receiver = "com.yagay.YFloat.FloatServiceBootReceiver"
ipc_routes = [
  { action = "com.yagay.YFloat.action.GOOGLE_CTS_BRIDGE", receiver = "com.yagay.YFloat.GoogleCtsBridgeReceiver" },
  { action = "com.yagay.YFloat.action.GOOGLE_CTS_TRACE", receiver = "com.yagay.YFloat.GoogleCtsTraceReceiver" },
]
replaced_components = [
  { type = "service", class = "com.yagay.YFloat.LensAccessibilityService" },
  { type = "receiver", class = "com.yagay.YFloat.FloatServiceBootReceiver" },
  { type = "receiver", class = "com.yagay.YFloat.GoogleCtsBridgeReceiver" },
  { type = "receiver", class = "com.yagay.YFloat.GoogleCtsTraceReceiver" },
  { type = "provider", class = "com.yagay.YFloat.GoogleCtsBridgeProvider" },
]
hooks = [{ id = "yfloat/main", class = "com.yagay.YFloat.hook.YFloatModule" }]

